<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SpendWise — Smart personal finance and expense tracker with analytics, budgets, and recurring payments." />
  <title>SpendWise — Smart Expense Tracker</title>

  <!-- Tailwind CSS CDN (v3 Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          },
          colors: {
            sage: {
              50: '#f4f7f4',
              100: '#e5ede5',
              200: '#c7dac7',
              500: '#558b57',
              600: '#437045',
              700: '#345536'
            }
          },
          boxShadow: {
            card: '0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
            float: '0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03)'
          }
        }
      }
    };
  </script>

  <!-- Inter Font (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- SpendWise Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* Override Tailwind base for body */
    body {
      background-color: #f8f9fa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Hide scrollbar on mobile horizontal scroll for date pills */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    /* Loading skeleton */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 0.5rem;
    }

    /* App loading screen */
    #app-loading {
      position: fixed;
      inset: 0;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-pulse {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #437045;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: loadPulse 1.2s ease-in-out infinite;
    }
    @keyframes loadPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }

    /* Nav active style (JS applies .active class) */
    .nav-item.active {
      background-color: #f4f7f4 !important;
      color: #274029 !important;
      font-weight: 600;
      border-left: 3px solid #558b57;
    }
    .nav-item.active .nav-icon {
      color: #437045;
    }

    /* Premium card defaults */
    .premium-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(15,23,42,0.04), 0 2px 6px -1px rgba(15,23,42,0.02);
      border-radius: 1rem;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .premium-card:hover {
      box-shadow: 0 12px 32px -4px rgba(15,23,42,0.08), 0 4px 12px -2px rgba(15,23,42,0.03);
      border-color: #cbd5e1;
    }
    .premium-card-flat {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.04);
      border-radius: 1rem;
    }

    /* Form input focus ring */
    .form-input-focus:focus {
      outline: none;
      border-color: #558b57;
      box-shadow: 0 0 0 3px rgba(85,139,87,0.15);
    }

    /* Table row hover */
    .table-row-hover:hover { background-color: #f8fafc; }

    /* Modal backdrop blur */
    .modal-backdrop {
      background-color: rgba(15,23,42,0.4);
      backdrop-filter: blur(4px);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-scale-up { animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Chart canvas containers */
    .chart-container { position: relative; width: 100%; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900">

  <!-- =================== APP LOADING SCREEN =================== -->
  <div id="app-loading">
    <div class="loading-pulse mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 20h20M5 20V10l7-7 7 7v10"/>
        <rect x="9" y="14" width="6" height="6" rx="1"/>
      </svg>
    </div>
    <h2 class="text-base font-bold text-slate-800">SpendWise</h2>
    <p class="text-xs text-slate-400 mt-1">Loading your financial dashboard…</p>
  </div>

  <!-- =================== MAIN APP SHELL =================== -->
  <div id="app-shell" class="relative">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- =================== TOAST CONTAINER (injected by toast.js) =================== -->
  <!-- ID: spendwise-toast-container -->

  <!-- =================== MODAL CONTAINER (injected by modal.js) =================== -->
  <!-- ID: spendwise-modal-container -->

  <!-- =================== JAVASCRIPT MODULES =================== -->
  <!-- Load order matters: config → utils → storage → state → charts → components → app -->

  <!-- Core Utilities & Config -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>

  <!-- Charts Engine -->
  <script src="js/charts.js"></script>

  <!-- UI Components -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/transactions.js"></script>
  <script src="js/components/categories.js"></script>
  <script src="js/components/analytics.js"></script>
  <script src="js/components/recurring.js"></script>
  <script src="js/components/settings.js"></script>

  <!-- Main Application Orchestrator -->
  <script src="js/app.js"></script>

  <!-- Init: Hide loading screen after app boots -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Give app.js a tiny head start, then fade out loader
      setTimeout(() => {
        const loader = document.getElementById('app-loading');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.4s ease';
          setTimeout(() => loader.remove(), 400);
        }
        // Initialize Lucide icons across the whole page
        if (window.lucide) lucide.createIcons();
      }, 350);
    });
  </script>

</body>
</html>
